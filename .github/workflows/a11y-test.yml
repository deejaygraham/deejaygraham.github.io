name: A11y Tests
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Calculate social preview cache key
        id: social-preview-cache
        shell: bash
        run: |
          echo "key=social-previews-${{ runner.os }}-${{ hashFiles(
            'scripts/lib/generateAllSocialImages.js',
            'scripts/lib/generateSocialImage.js',
            'scripts/lib/getAdaptiveTitleLayout.js',
            'scripts/lib/splitLongLine.js',
            'scripts/lib/sanitizeHTML.js',
            'scripts/lib/slugify.js',
            'scripts/lib/paths.js',
            'src/_data/site.js',
            'src/assets/img/favicon.png'
          ) }}" >> "$GITHUB_OUTPUT"

      - name: Restore social preview cache
        uses: actions/cache/restore@v6
        with:
          path: build-cache/img/previews
          key: ${{ steps.social-preview-cache.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.social-preview-cache.outputs.key }}-

      - name: Build
        run: npm run build

      - name: Save social preview cache
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: build-cache/img/previews
          key: ${{ steps.social-preview-cache.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install Playwright
        uses: ./.github/actions/install-playwright
        
      - name: Run a11y tests against local _site
        uses: ./.github/actions/run-playwright
        with:
          with_local_site: "true"
          site_directory: _site
          playwright_cli_args: "--grep @a11y"
        
      - name: Upload Playwright report
        uses: ./.github/actions/upload-playwright-report
